# הפעלת שלושת חלקי המערכת יחד: PostgreSQL, Backend ו-Frontend.
# הערכים בקובץ מיועדים לפיתוח מקומי; בענן משתמשים ב-Secrets אמיתיים.
services:
  # בסיס הנתונים הקבוע של המערכת.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam_management
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # בודק ש-PostgreSQL מוכן לפני שה-Backend מתחיל.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user -d exam_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  # שרת REST API ב-Node.js ו-Express.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # קונפיגורציה שמועברת לשרת כ-Environment Variables.
    environment:
      PORT: 5001
      NODE_ENV: production
      CLIENT_URL: http://localhost:4173
      JWT_SECRET: local_docker_secret_change_before_cloud
      JWT_EXPIRES_IN: 2h
      DATABASE_URL: postgres://exam_user:exam_password@postgres:5432/exam_management
      DATABASE_SSL: "false"
    ports:
      - "5001:5001"

  # אפליקציית React שנבנית באמצעות Vite ומוגשת בפורט 4173.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:5001/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:4173"

# Volume שומר את נתוני PostgreSQL גם לאחר עצירת Containers.
volumes:
  postgres-data:
