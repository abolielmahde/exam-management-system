# תהליך CI: בניית Frontend, בדיקות Backend ובדיקת חולשות npm audit.
name: CI CD Security Pipeline
on:
  push:
    branches: [main, dev, feature/fullstack-final]
  pull_request:
    branches: [main]
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm audit --audit-level=high
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: backend
        run: npm install
      - working-directory: backend
        run: npm test
      - working-directory: backend
        run: npm audit --audit-level=high
